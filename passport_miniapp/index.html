<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121214" />
  <title>Паспорт стажёра</title>
  <!-- SRI is deliberately NOT set: Telegram serves a rolling file at an
       unversioned URL, so an integrity pin breaks the miniapp on their next
       update.

       `defer` IS a deliberate departure from the deployed les_training_miniapp,
       which includes this blocking. Blocking means that when telegram.org
       stalls -- branch wifi, or the intermittent blocking this SDK has seen in
       UZ -- the body never parses: no skeleton, no stylesheet, nothing at all.
       A blank page is the one failure this app may not produce. Deferred, the
       skeleton paints immediately, and execution order is still
       SDK-then-bundle (deferred classic and module scripts run in document
       order), so window.Telegram exists before main.ts reads it.

       What `defer` does NOT buy: main.ts still waits for this fetch to SETTLE,
       not merely for parsing. On an unreachable telegram.org that is the full
       network timeout with no bundle running -- which is why the slow-network
       line below is CSS, and why the "outside Telegram" copy in i18n.ts also
       names a dead connection as a cause. -->
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Runs during parse, ahead of BOTH deferred scripts above and below, and it
       is the only JavaScript on the critical path. It stamps the stored
       language onto <html> so the CSS below can pick the right copy while the
       bundle is still blocked behind the SDK fetch.

       If this is ever blocked (no CSP on api.office.lesailes.uz today, but a
       future one would need 'unsafe-inline'), the page keeps the `lang="ru"`
       already in the markup and shows the Russian line: degraded to one
       language, never degraded to a blank. -->
  <script>
    try {
      var l = localStorage.getItem("passport_lang");
      if (l === "uz" || l === "ru") document.documentElement.lang = l;
    } catch (e) {}
  </script>
</head>
<body>
  <!-- The loading screen is static markup, not JS-rendered: on a mid-range
       Android it paints on the first frame, before the bundle has parsed. -->
  <div id="screen-loading" class="screen screen--top screen-active">
    <div class="sk-head">
      <div class="sk-bar sk-bar--title"></div>
      <div class="sk-bar sk-bar--sub"></div>
    </div>
    <div class="sk-list">
      <div class="sk-tile"></div>
      <div class="sk-tile"></div>
      <div class="sk-tile"></div>
    </div>
    <!-- The slow-network line is STATIC MARKUP revealed by a pure-CSS delay,
         not JS, and this is the whole point of the arrangement: main.ts is a
         module and the SDK above is a deferred classic script, so they share
         one execution list in document order. main.ts therefore waits for the
         telegram.org fetch to SETTLE, not merely for parsing. When
         telegram.org is unreachable the bundle does not run for the length of
         the browser's network timeout — so a JS timer could not start, and the
         skeleton would shimmer in silence with nothing to read. CSS needs no
         such permission.

         Both languages ship; the [lang] rules in style.css choose one. That
         puts these two strings outside i18n.ts on purpose — they are the only
         copy that must render with the bundle dead. -->
    <p id="loading-hint" class="loading-hint">
      <span data-lang="ru">Связь медленная. Ждём ответ…</span>
      <span data-lang="uz">Aloqa sekin. Javobni kutyapmiz…</span>
    </p>
  </div>

  <div id="screen-view" class="screen" hidden aria-live="polite"></div>

  <!-- Floating language pill. Static labels, so it needs no translation and
       stays readable in whichever language the app is currently in. -->
  <div id="lang-panel" class="lang-panel" hidden>
    <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    <button type="button" data-lang="uz" aria-pressed="false">O‘z</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
